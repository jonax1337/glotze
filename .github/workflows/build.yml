name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" "platforms;android-35" "build-tools;35.0.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build with a disposable CI key
        shell: bash
        run: |
          export TVHOME_JDK="$(cygpath -u "$JAVA_HOME")"
          export ANDROID_HOME="$(cygpath -u "$ANDROID_HOME")"
          bash build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tvhome-ci-apk
          path: build/tvhome.apk
          if-no-files-found: error
          retention-days: 7
